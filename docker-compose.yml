services:
  rest:
    image: apache/iceberg-rest-fixture
    container_name: iceberg-rest

    networks:
      iceberg_net:

    ports:
      - "8181:8181"

    volumes:
      - ./docker/iceberg/catalog:/catalog

    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1

      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000

      # Persist SQLite Catalog
      - uri=jdbc:sqlite:/catalog/iceberg_catalog.db

  minio:
    image: minio/minio
    container_name: minio

    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio

    networks:
      iceberg_net:
        aliases:
          - warehouse.minio

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - ./docker/minio/data:/data

    command:
      - server
      - /data
      - --console-address
      - ":9001"

  mc:
    image: minio/mc
    container_name: mc

    depends_on:
      - minio

    networks:
      iceberg_net:

    entrypoint: |
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password)
      do
          echo 'Waiting for MinIO...'
          sleep 2
      done;

      /usr/bin/mc mb minio/warehouse --ignore-existing;

      tail -f /dev/null
      "

  trino:
    image: trinodb/trino:latest
    container_name: trino

    ports:
      - "8080:8080"

    volumes:
      - ./docker/trino/config.properties:/etc/trino/config.properties
      - ./docker/trino/node.properties:/etc/trino/node.properties
      - ./docker/trino/jvm.config:/etc/trino/jvm.config
      - ./docker/trino/catalog:/etc/trino/catalog

    depends_on:
      rest:
        condition: service_healthy

    networks:
      - iceberg_net

networks:
  iceberg_net:
